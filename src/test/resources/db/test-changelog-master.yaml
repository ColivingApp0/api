databaseChangeLog:
  - include:
      file: db/changelog/changesets/1.0.0-identity-schema.yaml

  # Seeds legacy rows so the 1.0.1 profile migration has data to copy.
  # Runs between the two production changesets: after 1.0.0 creates
  # identity_profile, before 1.0.1 copies and drops it.
  - changeSet:
      id: seed-identity-profile-for-migration
      author: coliving
      changes:
        - sql:
            sql: |
              INSERT INTO identity_user
                (id, email, password_hash, status, email_verified, created_at, updated_at)
              VALUES
                ('11111111-1111-1111-1111-111111111111', 'migrated@example.com', 'test-hash',
                 'ACTIVE', TRUE, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP);

              INSERT INTO identity_profile
                (user_id, full_name, phone, guest_type, home_city_id,
                 stay_preferences, affinity_visible, verification_level, updated_at)
              VALUES
                ('11111111-1111-1111-1111-111111111111', 'Migrated User', '3001234567', 'ESTUDIANTE',
                 '22222222-2222-2222-2222-222222222222', 'wifi,pet', TRUE, 'COMPLETO', CURRENT_TIMESTAMP);

  - include:
      file: db/changelog/changesets/1.0.1-profile-context.yaml

  - include:
      file: db/changelog/changesets/2.0.0-accommodation-schema.yaml