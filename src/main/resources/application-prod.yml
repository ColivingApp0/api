spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: false
logging:
  level:
    root: INFO
server:
  port: 8080

# The API documentation publishes the whole surface of the API, so production
# keeps it off unless the deployment opts in with SWAGGER_ENABLED=true.
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

# Production never enables the dev bootstrap admin.
identity:
  bootstrap:
    enabled: false