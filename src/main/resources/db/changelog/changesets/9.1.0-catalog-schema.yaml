databaseChangeLog:
  - changeSet:
      id: 9.1.0-catalog-schema
      author: coliving
      remarks: >-
        Creates the managed catalogs of the administration (RF-083):
        institutions, faculties, careers, cities, services, rules, room types
        and accessibility features, in a single entry table per category with
        an optional self hierarchy (FACULTAD -> INSTITUCION, CARRERA ->
        FACULTAD). Other contexts reference entries by plain UUID (no FK).
      changes:
        - createTable:
            tableName: catalog_entry
            remarks: Managed catalog entry (RF-083).
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_catalog_entry
              - column:
                  name: category
                  type: VARCHAR(40)
                  constraints:
                    nullable: false
              - column:
                  name: code
                  type: VARCHAR(60)
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(120)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: parent_id
                  type: UUID
                  remarks: Self reference for hierarchical categories (no hard FK).
              - column:
                  name: active
                  type: BOOLEAN
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: catalog_entry
            columnNames: category, code
            constraintName: uq_catalog_category_code
        - addForeignKeyConstraint:
            baseTableName: catalog_entry
            baseColumnNames: parent_id
            referencedTableName: catalog_entry
            referencedColumnNames: id
            constraintName: fk_catalog_entry_parent
        - createIndex:
            indexName: idx_catalog_category_active
            tableName: catalog_entry
            columns:
              - column:
                  name: category
              - column:
                  name: active