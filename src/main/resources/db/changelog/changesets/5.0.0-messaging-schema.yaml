databaseChangeLog:
  - changeSet:
      id: 5.0.0-messaging-schema
      author: coliving
      remarks: Creates the messaging bounded-context schema (conversations,
        messages and in-app notifications). The reservation reference is a plain
        UUID (no FK); the user references point to identity_user per the
        architecture rule. At most one conversation per reservation (RF-050).
      changes:
        - createTable:
            tableName: messaging_conversation
            remarks: Thread between the two parties of a reservation (RF-050).
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_messaging_conversation
              - column:
                  name: reservation_id
                  type: UUID
                  remarks: Reference to booking_reservation (no FK); unique, one thread per reservation.
                  constraints:
                    nullable: false
              - column:
                  name: guest_user_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: host_user_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: messaging_conversation
            columnNames: reservation_id
            constraintName: uq_messaging_conversation_reservation
        - addForeignKeyConstraint:
            baseTableName: messaging_conversation
            baseColumnNames: guest_user_id
            referencedTableName: identity_user
            referencedColumnNames: id
            constraintName: fk_messaging_conversation_guest
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: messaging_conversation
            baseColumnNames: host_user_id
            referencedTableName: identity_user
            referencedColumnNames: id
            constraintName: fk_messaging_conversation_host
            onDelete: CASCADE
        - createIndex:
            indexName: idx_messaging_conversation_guest
            tableName: messaging_conversation
            columns:
              - column:
                  name: guest_user_id
        - createIndex:
            indexName: idx_messaging_conversation_host
            tableName: messaging_conversation
            columns:
              - column:
                  name: host_user_id
        - createTable:
            tableName: messaging_message
            remarks: A single message inside a conversation, always identified by its sender (RF-050).
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_messaging_message
              - column:
                  name: conversation_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: sender_user_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: body
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: sent_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: messaging_message
            baseColumnNames: conversation_id
            referencedTableName: messaging_conversation
            referencedColumnNames: id
            constraintName: fk_messaging_message_conversation
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: messaging_message
            baseColumnNames: sender_user_id
            referencedTableName: identity_user
            referencedColumnNames: id
            constraintName: fk_messaging_message_sender
            onDelete: CASCADE
        - createIndex:
            indexName: idx_messaging_message_conversation_sent
            tableName: messaging_message
            columns:
              - column:
                  name: conversation_id
              - column:
                  name: sent_at
        - createTable:
            tableName: messaging_notification
            remarks: In-app notification of a user; content-free payload (RF-051).
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_messaging_notification
              - column:
                  name: user_id
                  type: UUID
                  remarks: Recipient of the notification.
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: VARCHAR(40)
                  constraints:
                    nullable: false
              - column:
                  name: title
                  type: VARCHAR(200)
                  constraints:
                    nullable: false
              - column:
                  name: reference_id
                  type: UUID
                  remarks: Points at the conversation today; generic on purpose.
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: read_at
                  type: TIMESTAMP WITH TIME ZONE
                  remarks: Null while the notification is unread.
        - addForeignKeyConstraint:
            baseTableName: messaging_notification
            baseColumnNames: user_id
            referencedTableName: identity_user
            referencedColumnNames: id
            constraintName: fk_messaging_notification_user
            onDelete: CASCADE
        - createIndex:
            indexName: idx_messaging_notification_user_created
            tableName: messaging_notification
            columns:
              - column:
                  name: user_id
              - column:
                  name: created_at